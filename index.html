<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GENERATIVE_SWISS_LAYOUT</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;600&family=Space+Grotesk:wght@700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- 极简几何光标 -->
    <div id="cursor"></div>

    <main class="layout">
        <!-- 左侧竖向信息 -->
        <aside class="sidebar">
            <div class="vertical-text">MOTION THROUGH TYPOGRAPHY</div>
            <div class="index">102.</div>
            <div class="brand">SEMFORT<br>ACTIVEWEAR</div>
        </aside>

        <!-- 核心排版区域 -->
        <section class="poster">
            <div class="typography-block" id="poster-area">
                <h1 class="stretch">STRETCH</h1>
                <h1 class="never">NEVER</h1>
                <div class="row">
                    <h1 class="stop">STOP</h1>
                    <div class="circle-graphic"></div>
                </div>
                <h1 class="moving">MOVING</h1>
                <div class="bottom-row">
                    <h2 class="repeat">REPEAT SHIFT</h2>
                    <h2 class="collide">COLLIDE</h2>
                </div>
            </div>
        </section>
    </main>

    <!-- 背景的几何阵列 -->
    <div class="pattern-bg" id="pattern-bg"></div>

    <script src="script.js"></script>
</body>
</html>
